name: Price Tracker Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape prices
        run: python goscrape.py
        env:
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}